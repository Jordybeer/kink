name: Switch local group patch

on:
  push:
    branches:
      - feature/switch-share-bundle

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: node scripts/patch-switch-local-group.mjs
      - run: npm run lint
      - run: npm test
      - run: npm run build
      - name: Commit verified local-group boundary
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/page.tsx directie.md
          git diff --cached --quiet && exit 0
          git commit -m "Houd Switch group-id lokaal"
          git push
