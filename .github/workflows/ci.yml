name: KinkSync CI

on:
  pull_request:
    branches: [dev, main]
  push:
    branches: [dev]

permissions:
  contents: read

# A newer commit on the same ref makes the older candidate irrelevant. Cancelling
# that stale workflow saves runner time without ever reusing its result.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-and-build:
    name: Lint, test and build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 26
          cache: npm
      - run: npm ci
      - run: npm audit --audit-level=high
      - run: npm run lint
      - run: npm test
      - run: npm run build

  # The complete browser suite stays single-worker for deterministic local-first
  # state isolation. Give it enough wall-clock room to finish instead of turning
  # a slow GitHub runner into a false product failure.
  scene-rehearsal:
    name: Browser and device rehearsal
    runs-on: ubuntu-latest
    timeout-minutes: 45
    # Do not make the regular and production-browser rehearsals for one PR fight
    # for downloads/build resources at the same time. Other PRs remain independent.
    concurrency:
      group: browser-${{ github.repository }}-${{ github.event.pull_request.number || github.ref_name }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 26
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium webkit
      - run: npm run test:e2e
        env:
          CI: "1"
      - run: npm run test:e2e:launch
        env:
          CI: "1"
      - run: npm run test:e2e:print
        env:
          CI: "1"
      - name: Keep visual rehearsal screenshots
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: visual-rehearsal-screenshots
          path: |
            test-results/device-screenshots
            test-results/print-screenshots
          if-no-files-found: ignore
          retention-days: 14
      - name: Keep Playwright failure diagnostics
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: playwright-failure-diagnostics
          path: |
            playwright-report
            test-results
          if-no-files-found: warn
          retention-days: 14

  # Offline/PWA behavior needs a real production build. Keep it as a separate
  # gate, but serialize it with the regular browser rehearsal for this candidate.
  pwa-rehearsal:
    name: Production PWA and offline rehearsal
    runs-on: ubuntu-latest
    timeout-minutes: 40
    concurrency:
      group: browser-${{ github.repository }}-${{ github.event.pull_request.number || github.ref_name }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 26
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e:offline
        env:
          CI: "1"
      - name: Keep offline failure diagnostics
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: offline-failure-diagnostics
          path: |
            playwright-report
            test-results
          if-no-files-found: warn
          retention-days: 14
