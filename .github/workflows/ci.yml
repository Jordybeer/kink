name: safe-word check

on:
  pull_request:
    branches: [dev, main]
  push:
    branches: [dev]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-and-build:
    name: Lint, test and build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 26
          cache: npm
      - run: npm ci
      - name: Audit dependencies
        shell: bash
        run: |
          set +e
          npm audit --audit-level=high --json > npm-audit.json
          audit_status=$?
          set -e
          if [ "$audit_status" -ne 0 ]; then
            node <<'NODE'
          const fs = require("node:fs");
          const report = JSON.parse(fs.readFileSync("npm-audit.json", "utf8"));
          for (const [name, vulnerability] of Object.entries(report.vulnerabilities ?? {})) {
            if (!(["high", "critical"].includes(vulnerability.severity))) continue;
            const advisory = (vulnerability.via ?? []).find((item) => item && typeof item === "object");
            const title = advisory?.title ?? "Security advisory";
            const range = vulnerability.range ?? "unknown range";
            const fix = vulnerability.fixAvailable === false
              ? "no automatic fix"
              : JSON.stringify(vulnerability.fixAvailable);
            console.log(`::error title=npm audit: ${name} (${vulnerability.severity})::${title}; affected ${range}; fix ${fix}`);
          }
          NODE
            exit "$audit_status"
          fi
      - run: npm run lint
      - run: npm test
      - run: npm run build

  # The dungeon rehearsal has earned the safeword: the full suite has stayed
  # green across the hardening PRs, so browser regressions now block a merge.
  # A small launch matrix then checks the current iPhone/iPad/Galaxy-sized
  # surfaces without multiplying the entire 200+ test suite four times.
  scene-rehearsal:
    name: Browser and device rehearsal
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 26
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium webkit
      - run: npm run test:e2e
        env:
          CI: "1"
      - run: npm run test:e2e:launch
        env:
          CI: "1"
      - name: Keep device smoke screenshots
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: device-smoke-screenshots
          path: test-results/device-screenshots
          if-no-files-found: ignore
          retention-days: 14

  # PWA/offline behavior only exists in a production build. It used to be a
  # local-only suite; for a mobile-first public release it belongs in CI too.
  pwa-rehearsal:
    name: Production PWA and offline rehearsal
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 26
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e:offline
        env:
          CI: "1"
