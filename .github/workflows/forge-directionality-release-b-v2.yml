name: Forge directionality Release B v2

on:
  push:
    branches:
      - feature/directionality-catalog-audit

permissions:
  contents: write

jobs:
  forge:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: node scripts/forge-directionality-release-b-v2.mjs
      - run: npm run lint
      - run: npm test
      - run: npm run build
      - name: Commit bewezen productwerk
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add lib/kinks.ts lib/directionality.ts lib/questionnaireMetadata.ts __tests__/kinks.test.ts __tests__/directionality.test.ts __tests__/directionalMatching.test.ts __tests__/directionalityIntegration.test.ts __tests__/questionnaire.test.ts directie.md docs/directionality-catalog-audit.md planned-changes.md
          git diff --cached --quiet && exit 0
          git commit -m "Geef duidelijke kinks twee kanten"
          git push
