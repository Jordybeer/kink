name: Debug role-affinity e2e

on:
  push:
    branches:
      - feature/directionality-role-affinity

permissions:
  contents: write

jobs:
  debug:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium webkit
      - name: Run e2e and capture output
        shell: bash
        run: |
          set +e
          npm run test:e2e 2>&1 | tee debug-role-affinity-e2e.log
          status=${PIPESTATUS[0]}
          if [ "$status" -ne 0 ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add debug-role-affinity-e2e.log
            git commit -m "Capture Release C e2e failure" || true
            git push
          fi
          exit "$status"
