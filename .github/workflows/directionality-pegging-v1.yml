name: Directionality pegging forge

on:
  push:
    branches:
      - feature/directionality-pegging-v1

permissions:
  contents: write

jobs:
  forge:
    if: github.event.head_commit.message == 'Zet de directionality-smidse klaar'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: node scripts/apply-directionality-pegging-v1.mjs
      - run: npm test
      - run: npm run build
      - name: Commit bewezen productcode
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add lib/kinks.ts lib/directionality.ts lib/questionnaireMetadata.ts lib/questionnaireEngine.ts lib/sanitizeProfile.ts lib/shareProfile.ts lib/storeCore.ts components/TriageDeck.tsx __tests__/kinks.test.ts __tests__/questionnaire.test.ts __tests__/directionality.test.ts
          git diff --cached --check
          git commit -m "Splits pegging zonder rol te voorspellen"
          git push origin HEAD:feature/directionality-pegging-v1
