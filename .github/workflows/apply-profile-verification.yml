name: Apply profile verification code

on:
  pull_request:
    branches:
      - dev
    types:
      - synchronize
    paths:
      - .github/workflows/apply-profile-verification.yml
      - scripts/apply-profile-verification.py
      - scripts/profile-verification-src/**

permissions:
  contents: write

jobs:
  transform-test-build-commit:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v4
        with:
          ref: feature/lossless-multi-qr-share
          fetch-depth: 0

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Apply assertion-guarded profile verification
        run: |
          python3 scripts/apply-profile-verification.py
          git diff --check
          test -f lib/profileVerification.ts
          test -f __tests__/profileVerification.test.ts
          test ! -e scripts/profile-verification-src
          test ! -e scripts/apply-profile-verification.py
          test ! -e .github/workflows/apply-profile-verification.yml

      - name: Install exact dependencies
        run: npm ci

      - name: Run full unit suite
        run: npm test

      - name: Build Next, TypeScript and Serwist
        run: npm run build

      - name: Commit proven profile verification
        run: |
          git config user.name "Jordybeer"
          git config user.email "19562111+Jordybeer@users.noreply.github.com"
          git add -A
          git commit -m "Geef gedeelde profielen een vaste profielcode"
          git push origin HEAD:feature/lossless-multi-qr-share
