name: Apply lossless profile sharing

on:
  push:
    branches:
      - feature/lossless-multi-qr-share
    paths:
      - .github/workflows/apply-lossless-share.yml
  pull_request:
    branches:
      - dev
    types:
      - opened
      - synchronize
      - reopened
    paths:
      - .github/workflows/apply-lossless-share.yml
      - scripts/apply-lossless-share.py
      - scripts/lossless-share-src/**

permissions:
  contents: write

jobs:
  transform-test-build-commit:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v4
        with:
          ref: feature/lossless-multi-qr-share
          fetch-depth: 0

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Apply assertion-guarded feature
        run: |
          python3 scripts/apply-lossless-share.py
          git diff --check
          test ! -e scripts/lossless-share-src
          test ! -e scripts/apply-lossless-share.py
          test ! -e .github/workflows/apply-lossless-share.yml

      - name: Install exact dependencies
        run: npm ci

      - name: Run full unit suite
        run: npm test

      - name: Build Next, TypeScript and Serwist
        run: npm run build

      - name: Commit the proven feature
        run: |
          git config user.name "Jordybeer"
          git config user.email "19562111+Jordybeer@users.noreply.github.com"
          git add -A
          git commit -m "Laat elk deelbaar verlangen lossless reizen"
          git push origin HEAD:feature/lossless-multi-qr-share
