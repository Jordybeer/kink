name: forge role-neutral directionality

on:
  push:
    branches:
      - feature/directionality-role-neutral-actions

permissions:
  contents: write

jobs:
  forge:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Trek de juiste speelkamer open
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: feature/directionality-role-neutral-actions
          fetch-depth: 0

      - name: Zet Node aan de ketting
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 22
          cache: npm

      - name: Smeed Release F
        run: node .github/scripts/forge-directionality-role-neutral.mjs

      - name: Installeer exact de lockfile
        run: npm ci

      - name: Laat de volledige unit-suite bijten
        run: npm test

      - name: Bouw de hele dungeon
        run: npm run build

      - name: Ruim de smidse op en push alleen bewezen werk
        env:
          BRANCH: feature/directionality-role-neutral-actions
        run: |
          rm .github/scripts/forge-directionality-role-neutral.mjs
          rm .github/workflows/forge-directionality-role-neutral.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "Geen productdiff om te pushen"
            exit 1
          fi
          git commit -m "feat: geef role-neutrale partnerhandelingen twee kanten"
          git push origin HEAD:"$BRANCH"
