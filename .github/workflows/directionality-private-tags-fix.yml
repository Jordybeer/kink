name: directionality private tags forge

on:
  push:
    branches: [feature/directionality-consumer-closeout]
    paths:
      - .github/workflows/directionality-private-tags-fix.yml

permissions:
  contents: write

jobs:
  forge:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: feature/directionality-consumer-closeout
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 26
          cache: npm
      - run: npm ci
      - run: node scripts/directionality-private-tags-fix.mjs
      - run: npm run lint
      - run: npm test
      - run: npm run build
      - name: Commit proven fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/scene/page.tsx e2e/scene.spec.ts
          git diff --cached --quiet && { echo "No product changes produced"; exit 1; }
          git commit -m "Verberg private counterpart-tags in scenes"
          git push origin HEAD:feature/directionality-consumer-closeout
