name: Directionality review patch

on:
  push:
    branches:
      - feature/directionality-catalog-audit

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: node scripts/patch-directionality-review.mjs
      - run: npm run lint
      - run: npm test
      - run: npm run build
      - name: Commit reviewfixes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add __tests__/directionalMatching.test.ts planned-changes.md
          git diff --cached --quiet && exit 0
          git commit -m "Sluit directionality review af"
          git push
