name: semantic-flow-v3-followup

on:
  push:
    branches: [feature/questionnaire-semantic-flow-v3]

permissions:
  contents: write

concurrency:
  group: semantic-flow-v3-followup
  cancel-in-progress: true

jobs:
  validate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 26
          cache: npm
      - name: Apply fail-closed review fixes
        run: |
          node scripts/semantic-flow-v3-followup.mjs
          git diff --check
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run build
      - name: Commit validated review fixes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "Review transform produced no changes" >&2
            exit 1
          fi
          git commit -m "Sluit semantic-flow review af"
          git push origin HEAD:feature/questionnaire-semantic-flow-v3
