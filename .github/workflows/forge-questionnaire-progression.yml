name: Forge questionnaire progression

on:
  push:
    branches:
      - feature/questionnaire-progression-gates

permissions:
  contents: write

jobs:
  forge:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: node scripts/forge-questionnaire-progression.mjs
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run build
      - name: Commit verified progression gates
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add lib/questionnaireEngine.ts planned-changes.md
          git diff --cached --quiet && exit 0
          git commit -m "Laat verdiepingsvragen netjes in waterval lopen"
          git push
