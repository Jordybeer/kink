name: Refresh Next security lock

on:
  push:
    branches: [security/next-16.3.8-20261001]

permissions:
  contents: write

jobs:
  refresh-lock:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 26
          cache: npm
      - name: Refresh lockfile for patched Next
        run: npm install --package-lock-only --ignore-scripts --save-exact next@16.3.8
      - name: Verify critical/high audit gate
        run: npm audit --audit-level=high
      - name: Remove temporary workflow and commit lockfile
        shell: bash
        run: |
          rm .github/workflows/refresh-next-security-lock.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json .github/workflows/refresh-next-security-lock.yml
          git commit -m "Refresh lockfile for Next 16.3.8"
          git push origin HEAD:security/next-16.3.8-20261001
