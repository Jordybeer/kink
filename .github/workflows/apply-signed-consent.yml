name: signed consent hardening gate

on:
  push:
    branches:
      - automation/signed-consent-ledger
    paths:
      - .github/workflows/apply-signed-consent.yml

permissions:
  contents: write
  pull-requests: write
  issues: write

concurrency:
  group: signed-consent-hardening
  cancel-in-progress: false

jobs:
  prove-and-land:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Open the current feature branch
        uses: actions/checkout@v4
        with:
          ref: feature/signed-consent-ledger
          fetch-depth: 0

      - name: Fetch the hardening instructions
        run: |
          git fetch origin automation/signed-consent-ledger:refs/remotes/origin/automation/signed-consent-ledger
          git show origin/automation/signed-consent-ledger:automation/signed-consent/08_harden_existing.py > /tmp/harden.py

      - name: Apply the authorised hardening pass
        run: python /tmp/harden.py

      - name: Install, test and build
        shell: bash
        run: |
          set +e
          npm ci 2>&1 | tee /tmp/npm-ci.log
          install_status=${PIPESTATUS[0]}
          if [ "$install_status" -eq 0 ]; then
            npm test 2>&1 | tee /tmp/tests.log
            test_status=${PIPESTATUS[0]}
          else
            test_status=99
          fi
          if [ "$install_status" -eq 0 ] && [ "$test_status" -eq 0 ]; then
            npm run build 2>&1 | tee /tmp/build.log
            build_status=${PIPESTATUS[0]}
          else
            build_status=99
          fi

          if [ "$install_status" -ne 0 ] || [ "$test_status" -ne 0 ] || [ "$build_status" -ne 0 ]; then
            {
              echo '## ❌ Signed-consent hardening gate failed'
              echo
              echo "Install: $install_status · Tests: $test_status · Build: $build_status"
              echo
              echo '<details><summary>Laatste uitvoer</summary>'
              echo
              echo '```text'
              tail -n 30 /tmp/npm-ci.log 2>/dev/null
              tail -n 70 /tmp/tests.log 2>/dev/null
              tail -n 70 /tmp/build.log 2>/dev/null
              echo '```'
              echo '</details>'
            } > /tmp/pr-comment.md
            gh pr comment 270 --repo Jordybeer/kink --body-file /tmp/pr-comment.md
            exit 1
          fi

      - name: Collar the proven product changes
        run: |
          git config user.name "Jordybeer"
          git config user.email "19562111+Jordybeer@users.noreply.github.com"
          git add \
            types/index.ts \
            lib/consentProof.ts \
            lib/store.ts \
            lib/backupRestore.ts \
            components/ProfileTrust.tsx \
            components/ConsentLedgerPanel.tsx \
            components/sheets/EncryptedBackupSheets.tsx \
            app/page.tsx \
            docs/signed-consent.md \
            planned-changes.md \
            __tests__/consentProof.test.ts \
            __tests__/consentStore.test.ts \
            __tests__/backupRestore.test.ts
          git commit -m "Laat alleen bevoegde sleutels toestemming verzegelen"
          git push origin HEAD:feature/signed-consent-ledger
          {
            echo '## ✅ Signed-consent hardening gate passed'
            echo
            echo '- volledige Vitest-suite groen;'
            echo '- Next-productiebuild en TypeScript groen;'
            echo '- deelnemerautorisatie, store-locks en backup-eigenaarschap aangescherpt.'
            echo
            echo "Productcommit: $(git rev-parse HEAD)"
          } > /tmp/pr-comment.md
          gh pr comment 270 --repo Jordybeer/kink --body-file /tmp/pr-comment.md

