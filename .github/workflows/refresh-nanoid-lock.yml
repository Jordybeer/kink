name: Refresh nanoid lock

on:
  pull_request:
    types: [opened, synchronize]

permissions:
  contents: write

jobs:
  refresh:
    if: github.event.pull_request.head.ref == 'fix/nanoid-audit-dev-clean' && github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: fix/nanoid-audit-dev-clean
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 20
          cache: npm
      - name: Patch only nanoid in current dev lockfile
        run: |
          node <<'NODE'
          const fs = require('fs');
          const path = 'package-lock.json';
          const lock = JSON.parse(fs.readFileSync(path, 'utf8'));
          const entry = lock.packages?.['node_modules/nanoid'];
          if (!entry) throw new Error('node_modules/nanoid not found');
          if (entry.version !== '3.3.17') throw new Error(`Expected nanoid 3.3.17, found ${entry.version}`);
          entry.version = '3.3.18';
          entry.resolved = 'https://registry.npmjs.org/nanoid/-/nanoid-3.3.18.tgz';
          entry.integrity = 'sha512-DTg4MJbGMWkfi6VZFdNt2/caMbQy4Ou+Op/hJQvGEWcnVfoA1QA+xzRKAzw9jD6+GVOOeYr/mIcuDSdug6F6+w==';
          fs.writeFileSync(path, JSON.stringify(lock, null, 2) + '\n');
          NODE
      - name: Require an exact three-line lock diff
        run: |
          test "$(git diff --numstat -- package-lock.json)" = $'3\t3\tpackage-lock.json'
          test -z "$(git diff --name-only -- . ':!package-lock.json' ':!.github/workflows/refresh-nanoid-lock.yml')"
      - name: Validate install and audit
        run: |
          npm ci --ignore-scripts
          npm audit --audit-level=high
      - name: Commit generated lock fix and remove helper
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/refresh-nanoid-lock.yml
          git add package-lock.json
          git commit -m 'Fix nanoid audit blocker on dev'
          git push origin HEAD:fix/nanoid-audit-dev-clean
