              '## Impact extension — uitgevoerd\n\nCaning, crop, paddling, whipping, belt, face slapping, punching/thuding en trampling zijn item voor item goedgekeurd en nu expliciet gepaird. Iedere kant blijft zelfstandig antwoordbaar en gebruikt dezelfde questionnaire-affinity als Release C. Geen van deze instrumenten krijgt een canonical follow-up of progression-edge: het zijn alternatieve technieken, geen betrouwbare intensiteitsladder.\n\n## Niet meegenomen\n\nSpreader bar, hogtie, mummification, straitjacket, chastity, tape/andere gags, hood, collar/leash, suspension en verdiepende bondage blijven kandidaat maar niet automatisch goedgekeurd. Hun directionality is vaak duidelijk; de vraag blijft of catalogusgranulariteit, concrete woordkeuze en questionnairewaarde een split rechtvaardigen.\n',
          )
          with Path("docs/directionality-catalog-audit.md").open("a") as f:
              f.write("\n## Impact extension — uitgevoerd 11 augustus 2026\n\nNa Release C zijn acht resterende high-confidence Impact-acties individueel gesplitst: caning, crop, paddling, whipping, belt, face slapping, punching/thuding en trampling. De oude enkelvoudige IDs worden pre-launch verwijderd zonder antwoordkopie; give/receive matcht alleen complementair. Instrumentkeuze is geen escalatieladder, dus deze release voegt bewust geen canonical follow-ups of progression-gates toe.\n")
          replace_once(
              "docs/questionnaire-progression-gates.md",
              '- flogging, caning, crop, paddling en whipping onderling — instrument/techniek, niet lineaire intensiteit;\n',
              '- flogging, caning, crop, paddling, whipping, belt, face slapping, punching/thuding en trampling onderling — ook na hun directionele split blijven dit instrument-/techniekalternatieven, geen lineaire intensiteit;\n',
          )
          replace_once(
              "directie.md",
              'Release C bewijst role-affinity op een beperkte keten van bestaande Dynamic-anchors en directe semantische vervolgen: hand-spanking, implement-spanking, flogging, rope bondage, shibari, handcuffs, leather cuffs, ball/bit gag, blindfold en sound deprivation. Alleen de compacte Dynamic-anchor kiest per perspective een geassocieerde kant; alle andere productpaden blijven beide richtingen expliciet behandelen. Overige impact/bondage-items wachten nog steeds op item-per-item audit. Worship, toys en anatomy/equipment-gevoelige gevallen blijven apart staan totdat de labels ondubbelzinnig zijn.\n',
              'Release C bewijst role-affinity op een beperkte keten van bestaande Dynamic-anchors en directe semantische vervolgen: hand-spanking, implement-spanking, flogging, rope bondage, shibari, handcuffs, leather cuffs, ball/bit gag, blindfold en sound deprivation. De volgende Impact-audit splitst ook caning, crop, paddling, whipping, belt, face slapping, punching/thuding en trampling item voor item. Alleen compacte Dynamic-selectie mag role-affinity gebruiken; alle andere productpaden behandelen beide richtingen expliciet. De Impact-instrumenten krijgen bewust geen progression- of canonical-edges. Overige bondage-items wachten nog op item-per-item audit. Worship, toys en anatomy/equipment-gevoelige gevallen blijven apart staan totdat de labels ondubbelzinnig zijn.\n',
          )
          replace_once(
