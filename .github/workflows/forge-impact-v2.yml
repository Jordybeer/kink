              'The original Pegging product gate and Release B role-neutral catalog audit are shipped. Release C now proves role-affinity on a deliberately small impact/bondage vertical slice: explicit pairs remain fully independent, while only compact Dynamic coverage may choose the perspective-aligned sibling. The opposite side stays unknown and reachable. Remaining impact/bondage candidates stay item-by-item work, not a bulk split.\n',
              'The original Pegging product gate and Release B role-neutral catalog audit are shipped. Release C proves role-affinity on a deliberately small impact/bondage vertical slice: explicit pairs remain fully independent, while only compact Dynamic coverage may choose the perspective-aligned sibling. The opposite side stays unknown and reachable. The audited Impact extension now splits caning, crop, paddling, whipping, belt, face slapping, punching/thuding and trampling; none gains progression or canonical inference. Remaining bondage candidates stay item-by-item work, not a bulk split.\n',
          )
          replace_once(
              "planned-changes.md",
              'Release C role affinity may only choose the compact Dynamic coverage sibling;\nthe opposite side remains unknown and independently answerable. Remaining\ndirectional candidates stay item-by-item editorial work and must not be bulk\nsplit or inferred from `profile.role`.\n',
              'Release C role affinity may only choose the compact Dynamic coverage sibling;\nthe opposite side remains unknown and independently answerable. The audited\nImpact instrument extension follows that same contract. Remaining directional\ncandidates stay item-by-item editorial work and must not be bulk split or\ninferred from `profile.role`.\n',
          )

          correction = '''\n## 2026-08-11 — Forge vertrouwde op de inspringing van een heel catalogusblok\n\n**What went wrong:** De eerste Impact-forge probeerde acht opeenvolgende catalogusitems als één exact multiline blok te vervangen. YAML-inspringing maakte die assertion fragiel; de workflow stopte veilig vóór enige wijziging, maar de transform was onnodig breed.\n\n**Rule:** Bij catalogusmigraties elk item afzonderlijk ankeren op zijn stabiele ID en exact één object vervangen. Gebruik een count-assertie per item; bundel nooit meerdere zelfstandige catalogusobjecten in één whitespace-gevoelige match.\n'''
          with Path("corrections.md").open("a") as f:
              f.write(correction)

          # Structural guards.
          ids = re.findall(r'\bid:\s*"([^"]+)"', Path("lib/kinks.ts").read_text())
          if len(ids) != len(set(ids)):
              raise SystemExit("duplicate catalog IDs after Impact split")
          for old_id in pairs:
              if old_id in ids:
                  raise SystemExit(f"retired catalog ID survived: {old_id}")
          d = Path("lib/directionality.ts").read_text()
          for old_id in pairs:
              if f'conceptId: "{old_id}"' not in d or f'  "{old_id}",' not in d:
                  raise SystemExit(f"directionality registry/retirement incomplete for {old_id}")
          meta = Path("lib/questionnaireMetadata.ts").read_text()
          for old_id in pairs:
              if re.search(rf'"{re.escape(old_id)}"', meta):
                  raise SystemExit(f"retired exact Impact ID remains in questionnaire metadata: {old_id}")
          PY

      - run: npm ci
      - run: npm test
      - run: npm run build

      - name: Check de speelkamer en sluit de forge af
        shell: bash
        run: |
          expected='__tests__/directionalMatching.test.ts
          __tests__/directionality.test.ts
          corrections.md
          directie.md
          docs/directionality-catalog-audit.md
          docs/directionality-role-affinity.md
          docs/questionnaire-progression-gates.md
          e2e/ui-audit.spec.ts
          lib/directionality.ts
          lib/kinks.ts
          lib/questionnaireMetadata.ts
          lib/storeCore.ts
          planned-changes.md'
          actual="$(git diff --name-only | grep -v '^.github/workflows/forge-impact-v2.yml$' | sort)"
          if [ "$actual" != "$(printf '%s\n' "$expected" | sed 's/^          //' | sort)" ]; then
            echo "Unexpected diff set"
            printf 'ACTUAL:\n%s\nEXPECTED:\n%s\n' "$actual" "$expected"
            exit 1
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/forge-impact-v2.yml
          git add __tests__/directionalMatching.test.ts __tests__/directionality.test.ts corrections.md directie.md \
            docs/directionality-catalog-audit.md docs/directionality-role-affinity.md docs/questionnaire-progression-gates.md \
            e2e/ui-audit.spec.ts lib/directionality.ts lib/kinks.ts lib/questionnaireMetadata.ts lib/storeCore.ts planned-changes.md
          git commit -m "feat: geef Impact beide kanten zonder voorkeur te raden"
