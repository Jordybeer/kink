name: Directionality v20 migration patch

on:
  push:
    branches:
      - feature/directionality-role-affinity

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: node scripts/patch-role-affinity-migration.mjs
      - run: npm run lint
      - run: npm test
      - run: npm run build
      - name: Commit bewezen migratiefix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add lib/storeCore.ts __tests__/directionality.test.ts e2e/fixtures.ts e2e/ui-audit.spec.ts e2e/scene.spec.ts e2e/compare.spec.ts
          git diff --cached --quiet && exit 0
          git commit -m "Migreer lokale directionality naar v20"
          git push
