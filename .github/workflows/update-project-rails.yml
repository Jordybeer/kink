name: Update project rails

on:
  pull_request:
    branches:
      - dev
    types:
      - synchronize
    paths:
      - .github/workflows/update-project-rails.yml
  push:
    branches:
      - feature/private-response-hardening
    paths:
      - .github/workflows/update-project-rails.yml

permissions:
  contents: write

jobs:
  update-test-and-commit:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: feature/private-response-hardening
          fetch-depth: 0

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Update planned changes and corrections
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          def replace_once(path: str, old: str, new: str) -> None:
              p = Path(path)
              text = p.read_text()
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"{path}: expected one anchor, found {count}: {old[:90]!r}")
              p.write_text(text.replace(old, new, 1))

          replace_once(
              "planned-changes.md",
              "- **Offline support**: PWA manifest exists but no service-worker caching strategy.\n",
              "- ~~**Offline support**: PWA manifest exists but no service-worker caching strategy.~~ → shipped via PR #263 and completed for newly created local profile/scene routes in PR #266 (see ledger).\n",
          )

          replace_once(
              "planned-changes.md",
              "## Shipped — historical ledger (full detail preserved in git log)\n\n",
              """## Shipped — historical ledger (full detail preserved in git log)\n\n### Local-first offline rooms (dev, 2026-07-28)\n\n| — | What landed | Commit |\n|---|-------------|--------|\n| — | New profiles and scenes created after the network cut now open through fixed precacheable shells; legacy `/profile/<id>` and `/scenes/<id>` doors fall back in the service worker; exact-ID persistence wait and cold-route guards cover the iOS failures found on device | `59890b1` / PR #266 |\n\n""",
          )

          replace_once(
              "corrections.md",
              "---\n\n## 2026-07-27 — De klik kende de nieuwe kamer, de oude voordeur niet\n",
              """---\n\n## 2026-07-28 — Een redundant icoon maakte de informatie niet redundant\n\n**What went wrong:** De opdracht was om het redundante info-icoon op de kinkkaart te vervangen door het privé-oogje. Dat werd te breed geïnterpreteerd als toestemming om ook de achterliggende `InfoSheet` uit de flow te verwijderen. De trigger was redundant; de inhoud bleef waardevol.\n\n**Rule:** Wanneer een affordance wordt vervangen, behandel trigger en bestemming als twee aparte beslissingen. Verwijder alleen het expliciet genoemde icoon of bedieningselement. Behoud de achterliggende informatie of actie en geef die een nieuwe, semantische ingang — hier: tikken op kinknaam of beschrijving — tenzij de eigenaar ook expliciet vraagt de inhoud te schrappen.\n\n---\n\n## 2026-07-27 — De klik kende de nieuwe kamer, de oude voordeur niet\n""",
          )
          PY

          git rm .github/workflows/update-project-rails.yml
          git diff --check

      - name: Install exact dependencies
        run: npm ci

      - name: Run full unit suite
        run: npm test

      - name: Build Next and Serwist for production
        run: npm run build

      - name: Commit proven rail updates
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "Jordybeer"
          git config user.email "19562111+Jordybeer@users.noreply.github.com"
          git add -A planned-changes.md corrections.md .github/workflows/update-project-rails.yml
          git commit -m "Schrijf local-first en InfoSheetlessen in het leerboek"
          git push origin HEAD:feature/private-response-hardening
