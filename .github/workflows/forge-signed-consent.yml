name: Forge signed consent ledger

on:
  pull_request:
    branches: [dev]
    types: [opened, reopened, synchronize]

permissions:
  contents: write

concurrency:
  group: signed-consent-${{ github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  forge:
    if: github.head_ref == 'feature/signed-consent-ledger'
    runs-on: ubuntu-latest
    steps:
      - name: Check out feature branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Apply signed-consent feature
        run: |
          cat scripts/.signed-consent-* | base64 --decode | gzip --decompress > /tmp/apply-signed-consent.py
          python /tmp/apply-signed-consent.py
          python - <<'PY'
          from pathlib import Path
          path = Path('lib/consentProof.ts')
          text = path.read_text()
          old = '''function base64UrlToBytes(value: string): Uint8Array {
            const padded = value.replace(/-/g, "+").replace(/_/g, "/")
              + "=".repeat((4 - (value.length % 4)) % 4);
            const binary = atob(padded);
            return Uint8Array.from(binary, (char) => char.charCodeAt(0));
          }'''
          new = '''function base64UrlToBytes(value: string): ArrayBuffer {
            const padded = value.replace(/-/g, "+").replace(/_/g, "/")
              + "=".repeat((4 - (value.length % 4)) % 4);
            const binary = atob(padded);
            const bytes = new Uint8Array(binary.length);
            for (let index = 0; index < binary.length; index++) bytes[index] = binary.charCodeAt(index);
            return bytes.buffer;
          }'''
          if text.count(old) != 1:
              raise SystemExit('base64 buffer patch anchor mismatch')
          path.write_text(text.replace(old, new, 1))
          PY

      - name: Run full unit suite
        run: npm test

      - name: Build production app
        run: npm run build

      - name: Commit product changes
        run: |
          git rm scripts/.signed-consent-* .github/workflows/forge-signed-consent.yml
          git add types lib components app __tests__ docs planned-changes.md
          git config user.name "KinkSync Forge"
          git config user.email "actions@users.noreply.github.com"
          git commit -m "Seal consent at the source"
          git push origin HEAD:${{ github.head_ref }}
