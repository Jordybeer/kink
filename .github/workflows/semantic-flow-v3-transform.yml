name: semantic-flow-v3-transform

on:
  push:
    branches: [feature/questionnaire-semantic-flow-v3]

permissions:
  contents: write

concurrency:
  group: semantic-flow-v3-transform
  cancel-in-progress: true

jobs:
  transform:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 26
          cache: npm
      - name: Validate and apply fail-closed transform
        run: |
          python3 scripts/patch-questionnaire-semantic-flow-v3.py
          python3 -m py_compile scripts/apply-questionnaire-semantic-flow-v3.py
          python3 scripts/apply-questionnaire-semantic-flow-v3.py
          rm -f scripts/patch-questionnaire-semantic-flow-v3.py
          git diff --check
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run build
      - name: Commit validated product changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "Transformer produced no changes" >&2
            exit 1
          fi
          git commit -m "Verfijn questionnaire-semantic flow"
          git push origin HEAD:feature/questionnaire-semantic-flow-v3
