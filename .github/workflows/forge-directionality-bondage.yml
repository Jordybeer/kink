name: forge bondage directionality

on:
  push:
    branches:
      - feature/directionality-bondage-restraints

permissions:
  contents: write

jobs:
  forge:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Trek de juiste speelkamer open
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: feature/directionality-bondage-restraints
          fetch-depth: 0

      - name: Zet Node aan de ketting
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 22
          cache: npm

      - name: Leer de smid de verse audittekst
        run: node .github/scripts/patch-bondage-forge-anchor.mjs

      - name: Smeed de zes restraint-paren
        run: node .github/scripts/forge-directionality-bondage.mjs

      - name: Trek de questionnaire-metadata mee
        run: node .github/scripts/forge-directionality-bondage-metadata.mjs

      - name: Installeer exact wat de lockfile toestaat
        run: npm ci

      - name: Laat alle unit-guards bijten
        run: npm test

      - name: Bouw de hele dungeon
        run: npm run build

      - name: Ruim de smidse op en push alleen bewezen werk
        env:
          BRANCH: feature/directionality-bondage-restraints
        run: |
          rm .github/scripts/forge-directionality-bondage.mjs
          rm .github/scripts/patch-bondage-forge-anchor.mjs
          rm .github/scripts/forge-directionality-bondage-metadata.mjs
          rm .github/workflows/forge-directionality-bondage.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "Geen productdiff om te pushen"
            exit 1
          fi
          git commit -m "feat: geef restraints twee onafhankelijke kanten"
          git push origin HEAD:"$BRANCH"
