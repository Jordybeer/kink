name: validate reviewed findings

on:
  push:
    branches: [polygamy]
    paths:
      - .github/workflows/review-findings-validate.yml

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          ref: polygamy
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 26
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - name: Prove roving tab focus with the current persisted schema
        run: npx playwright test e2e/profile-mobile-audit.spec.ts --grep "roving keyboard focus" --project=mobile
        env:
          CI: "1"
      - name: Remove the temporary validation workflow
        run: rm .github/workflows/review-findings-validate.yml
      - name: Commit the clean validated tree
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "Verwijder tijdelijke reviewvalidatie"
          git push origin HEAD:polygamy
