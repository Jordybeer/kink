name: diagnose reviewed tab focus

on:
  push:
    branches: [polygamy]
    paths:
      - .github/workflows/review-findings-validate.yml

permissions:
  contents: write

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          ref: polygamy
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 26
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Prove the pre-hydration seed and roving focus
        run: npx playwright test e2e/profile-mobile-audit.spec.ts --grep "roving keyboard focus" --project=mobile --retries=0
        env:
          CI: "1"
