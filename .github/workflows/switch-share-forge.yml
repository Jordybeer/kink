name: Switch share forge

on:
  push:
    branches:
      - feature/switch-share-bundle

permissions:
  contents: write

jobs:
  forge:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: node scripts/forge-switch-share.mjs
      - run: npm run lint
      - run: npm test
      - run: npm run build
      - name: Commit verified Switch share
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add types/index.ts lib/sanitizeProfile.ts lib/backupRestore.ts lib/parseSharePaste.ts components/QRModal.tsx app/page.tsx directie.md
          git diff --cached --quiet && exit 0
          git commit -m "Deel Switch als één bevestigd profiel"
          git push
